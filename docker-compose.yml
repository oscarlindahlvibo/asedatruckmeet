services:
  web:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    build: .
    command: npm run worker
    env_file: .env
    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: truckmeet
      POSTGRES_USER: truckmeet
      POSTGRES_PASSWORD: truckmeet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2026-07-13T18-09-56Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  pretix:
    image: pretix/standalone:stable
    profiles: ["pretix"]
    ports:
      - "8345:80"
    volumes:
      - pretix_data:/data

volumes:
  postgres_data:
  minio_data:
  pretix_data:
